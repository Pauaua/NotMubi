server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notmubi_auth
    username: notmubi
    password: notmubi
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Clave secreta para firmar JWT (en producción usar variables de entorno)
# Debe tener al menos 256 bits (32 caracteres) para HS256
jwt:
  secret: notmubi-super-secret-key-for-jwt-signing-change-in-production-1234567890
  expiration-ms: 86400000   # 24 horas en milisegundos

management:
  endpoints:
    web:
      exposure:
        include: health,info